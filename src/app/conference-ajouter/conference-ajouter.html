<div class="container p-4">
    <div class="form-group">
  <label for="nom">Nom Conference</label>
  <input name="nom" type="text" placeholder="Nom conference" [value]="nomConference()" (input)="nomConference.set($any($event.target).value)">
</div>
<div class="form-group">
  <label for="date">Date Conference</label>
  <input name="date" type="text" placeholder="Date conference" [value]="dateConference()" (input)="dateConference.set($any($event.target).value)">
</div>
<div class="form-group">
  <label for="location">Emplacement Conference</label>
  <input name="location" type="text" placeholder="Emplacement" [value]="locationConference()" (input)="locationConference.set($any($event.target).value)">
</div>
<div class="form-group">
  <label for="numplaces">Nombre de places restantes</label>
  <input type="number" placeholder="Emplacement" [value]="nbparticipantsConference()" (input)="nbparticipantsConference.set($any($event.target).value)">
</div>
<button class="btn btn-primary my-3"(click)="AjouterConference()">Ajouter Conference</button>
    
</div>
